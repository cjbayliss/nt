[project]
name = "nt"
description = "make text readable in terminals (normalize / fold / strict-ASCII levels)"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6",
]

[project.scripts]
nt = "nt.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--cov=nt --cov-report=term-missing --cov-fail-under=99"

[tool.coverage.run]
branch = true
disable_warnings = ["module-not-measured"]

[tool.coverage.report]
exclude_lines = ["assert_never", "\\(Protocol\\)", "if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["C4", "E", "F", "PERF", "FURB", "W", "I", "B", "SIM", "RET", "UP", "PLW0602", "PLW0603"]
ignore = [
    # `OSError | None` thunks keep an explicit `return None` on early exits.
    "RET501",
]

[tool.ruff.lint.isort]
known-first-party = ["nt"]

[tool.mypy]
strict = true
warn_unreachable = true
explicit_package_bases = true
python_version = "3.14"
mypy_path = ["src", "tests"]
files = ["src", "tests"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
